<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie | nays.addict</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

  <!-- GLASS NAVIGATION -->
  <nav class="glass-nav">
    <a href="index.html" class="nav-brand">nays.addict | <span>앤토니</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="tackle.html">Setups & Tackle</a>
      <a href="gallery.html" class="active">Galerie</a>
      <a href="about.html">Über mich</a>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <span class="badge">VISUALS</span>
    <h1>Moments on the Water</h1>
    <p>Catch shots, Equipment-Details und Eindrücke vom Wasser.</p>
  </header>

  <!-- GALLERY FILTER -->
  <section class="filter-section">
    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">Alle</button>
      <button class="filter-btn" data-filter="catches">Catches</button>
      <button class="filter-btn" data-filter="tackle">Tackle & Detail</button>
    </div>
  </section>

  <!-- GALLERY GRID -->
  <main class="gallery-container">
    <div class="gallery-grid">

      <!-- ITEM 1 -->
      <div class="gallery-item" data-category="catches">
        <img src="zanderpb.jpg" alt="Zander Catch">
        <div class="gallery-overlay">
          <span class="gallery-tag">Zander</span>
          <h3>PB Zander auf Nays VNM</h3>
        </div>
      </div>

      <!-- ITEM 2 -->
      <div class="gallery-item" data-category="tackle">
        <img src="shimanodc.jpg" alt="Baitcast Setup Detail">
        <div class="gallery-overlay">
          <span class="gallery-tag">Setup</span>
          <h3>Shimano DC</h3>
        </div>
      </div>

      <!-- ITEM 3 -->
      <div class="gallery-item" data-category="catches">
        <img src="hecht.jpg" alt="Barsch Catch">
        <div class="gallery-overlay">
          <span class="gallery-tag">Hecht</span>
          <h3>Hecht auf VNM 20</h3>
        </div>
      </div>

    </div>
  </main>

  <!-- FILTER SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filterButtons = document.querySelectorAll('.filter-btn');
      const galleryItems = document.querySelectorAll('.gallery-item');

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          filterButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');

          const filterValue = button.getAttribute('data-filter');

          galleryItems.forEach(item => {
            const itemCategory = item.getAttribute('data-category');
            if (filterValue === 'all' || filterValue === itemCategory) {
              item.style.display = 'block';
            } else {
              item.style.display = 'none';
            }
          });
        });
      });
    });
  </script>
</body>
</html>
